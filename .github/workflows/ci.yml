name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check publication contents
        run: python scripts/check_publication.py --ref HEAD

      - name: Test publication guard
        run: python -m unittest discover -s tests -p test_publication.py

      - name: Install backend dependencies
        if: hashFiles('requirements-dev.txt') != ''
        run: python -m pip install -r requirements-dev.txt

      - name: Test backend
        if: hashFiles('requirements-dev.txt') != ''
        run: python -m pytest -q

      - name: Set up Node
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build local container
        if: hashFiles('Dockerfile') != ''
        run: docker build --tag snapshot-knowledge-desk:ci .

      - name: Smoke test container with synthetic data
        if: hashFiles('Dockerfile') != '' && hashFiles('scripts/smoke_container.py') != ''
        run: python scripts/smoke_container.py --image snapshot-knowledge-desk:ci
