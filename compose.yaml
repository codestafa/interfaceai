services:
  knowledge:
    image: knowledge-desk:local
    build:
      context: .
      dockerfile: tools/Dockerfile
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-8080}:8000"
    environment:
      KNOWLEDGE_SNAPSHOTS: /data/snapshots
    volumes:
      - type: bind
        source: ${KNOWLEDGE_DATA_DIR:-./data/snapshots}
        target: /data/snapshots
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
